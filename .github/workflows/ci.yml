# Continuous integration: lint, test, build the service images for amd64 and
# arm64, start the compose stack and, on main and on version tags, publish the
# images to GitHub Container Registry.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request cancels the run in progress for that pull
# request. Every other run (main, tags, manual) gets its own group, so it is
# never cancelled and every commit on main gets its images.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Same versions as in the Dockerfiles and in CONTRIBUTING.md.
  UV_VERSION: "0.13.9"
  RUFF_VERSION: "0.17.6"
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1
  # librarian's embedding model (src/librarian/config.py), the key of its cache.
  EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Lint the Python code (ruff check)
        run: uvx "ruff@${RUFF_VERSION}" check --output-format=github services

      - name: Check the Python formatting (ruff format)
        run: uvx "ruff@${RUFF_VERSION}" format --check services

      - name: Lint the Dockerfiles (hadolint)
        run: |
          status=0
          for svc in watchman librarian observer; do
            echo "services/$svc/Dockerfile"
            docker run --rm -i "$HADOLINT_IMAGE" < "services/$svc/Dockerfile" || status=1
          done
          exit "$status"

      - name: Validate compose.yaml with the example environment
        run: |
          cp .env.example .env
          docker compose config --quiet

  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [watchman, librarian, observer]
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        # Over TCP: while the database is being created, PostgreSQL only
        # listens on its Unix socket.
        options: >-
          --health-cmd "pg_isready --host=127.0.0.1 --username=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8.8.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    env:
      # The integration tests fail instead of being skipped when these are
      # missing and CI is set. Each service creates its own test database.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@127.0.0.1:5432/postgres
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock

      - name: Install the locked dependencies
        run: uv sync --locked

      # librarian's relevance tests use the real embedding model (about 240 MB).
      # fastembed downloads it the first time; later runs restore it from here.
      - name: Restore the embedding model
        if: matrix.service == 'librarian'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fastembed
          key: fastembed-${{ env.EMBEDDING_MODEL }}

      - name: Run the unit and integration tests
        env:
          # Only librarian uses it.
          FASTEMBED_CACHE_PATH: ${{ runner.temp }}/fastembed
        run: uv run pytest

  build:
    name: build (${{ matrix.service }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [watchman, librarian, observer]
        arch: [amd64, arm64]
        # Each architecture is built on a runner of that architecture.
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    env:
      # Written in lowercase by hand: github.repository is feglez/AlexandrIA
      # and image names cannot contain capital letters.
      IMAGE: ghcr.io/feglez/alexandria-${{ matrix.service }}
      # Keep the build summary of each job, but not one extra artifact per build.
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate the image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Pull requests only build. Pushes to main and version tags also push
      # the image by digest, without a tag: the publish job tags it.
      - name: Build the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/${{ matrix.service }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }},mode=max
          outputs: ${{ github.event_name == 'push' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}

      - name: Export the image digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the image digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.service }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  smoke:
    name: smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # Overrides the value in .env: without the "llm" profile there is no
      # Ollama image and no model to download.
      COMPOSE_PROFILES: ""
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create .env from the example
        run: cp .env.example .env

      # Fails if an image does not build, a container does not become healthy
      # or the bootstrap job exits with an error.
      - name: Build the images and start the stack
        run: docker compose up -d --build --wait

      - name: Request the published ports from the host
        run: |
          curl -fsS http://127.0.0.1:8080/status.php
          echo
          for port in 8081 8082 8083; do
            curl -fsS "http://127.0.0.1:$port/healthz"
            echo
          done

      # End-to-end flows through the published ports, with the real Nextcloud.
      - name: Run the smoke test
        run: tests/smoke/smoke.sh

      - name: Show the containers
        if: always()
        run: docker compose ps --all

      - name: Show the logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack and delete the volumes
        if: always()
        run: docker compose down -v

  publish:
    name: publish (${{ matrix.service }})
    # Only for pushes to main and version tags, and only after every check.
    if: github.event_name == 'push'
    needs: [lint, test, build, smoke]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [watchman, librarian, observer]
    env:
      IMAGE: ghcr.io/feglez/alexandria-${{ matrix.service }}
    steps:
      - name: Download the image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # sha-<7 characters> for every commit, plus X.Y.Z and X.Y on a tag vX.Y.Z.
      - name: Generate the image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create the multi-arch manifest and push the tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=$(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for tag in $tags; do
            args+=(--tag "$tag")
          done
          for digest in *; do
            args+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect the published image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"

  # The only status check required by the main ruleset: the names of the
  # matrix jobs change when a service or an architecture is added.
  ci-ok:
    name: ci-ok
    # Without always() this job would be skipped when another one fails, and a
    # skipped required check counts as passed.
    if: always()
    needs: [lint, test, build, smoke, publish]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check the result of every job
        env:
          RESULTS: ${{ toJSON(needs) }}
          # publish only runs for pushes to main and version tags.
          PUBLISH: ${{ github.event_name == 'push' && 'success' || 'skipped' }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          jq -e --arg publish "$PUBLISH" \
            '.publish.result == $publish and (del(.publish) | all(.[]; .result == "success"))' \
            <<< "$RESULTS" > /dev/null
